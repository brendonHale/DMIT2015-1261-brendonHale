<!DOCTYPE html>
<html xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns="http://www.w3.org/1999/xhtml">
<f:view>
    <h:head>
        <title>Enrollment Confirmation</title>
    </h:head>
    <h:body>
        <h1>Enrollment Confirmation</h1>

        <h:outputText value="Student: " />
        <h:outputText value="#{enrollmentBean.studentName}" />

        <br/>

        <h:outputText value="Program: " />
        <h:outputText value="#{enrollmentBean.programName}" />

        <br/>

        <h:outputText value="Delivery Mode: " />
        <h:outputText value="#{enrollmentBean.deliveryMode}" />

    </h:body>
</f:view>
</html>
